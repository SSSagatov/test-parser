services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
      POSTGRES_USER: ${POSTGRES_USER:-procurement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procurement}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    shm_size: 1gb
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://procurement:procurement@postgres:5432/procurement}
      DOWNLOAD_FOLDER: /app/data/downloads
      EXPORT_FOLDER: /app/data/exports
      LOG_FOLDER: /app/logs
    volumes:
      - crawler_data:/app/data
      - crawler_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  crawler_data:
  crawler_logs:
