[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goszakup-pavlodar-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1,<2",
    "openpyxl>=3.1,<4",
    "tzdata>=2024.1",
    "pypdf>=6,<8",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.22,<2",
    "pymupdf>=1.25,<2",
    "legacy-doc>=0.2,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["goszakup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
