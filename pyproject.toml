[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kazakhstan-procurement-parser"
version = "0.1.0"
description = "Auditable, resumable crawler for official Kazakhstan procurement data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.51,<2", "requests>=2.32,<3", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "lxml>=5.3,<7", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pandas>=2.2,<4",
  "openpyxl>=3.1,<4", "pdfplumber>=0.11,<1", "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2", "tenacity>=9,<10", "loguru>=0.7,<1",
  "typer>=0.15,<1", "rich>=13.9,<15", "pytesseract>=0.3.13,<1",
  "pillow>=11,<13", "xlrd>=2.0,<3", "rarfile>=4.2,<5",
]

[project.scripts]
procurement-parser = "app.cli:cli"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1", "respx>=0.22,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "app/alembic.ini"
"migrations" = "app/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in read-only official portal checks", "postgres: requires TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
